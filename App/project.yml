name: Legado
options:
  developmentLanguage: zh-Hans
  knownRegions: [zh-Hans, en, Base]
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Manual
    TARGETED_DEVICE_FAMILY: '1,2'
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.11.1
  LegadoCore:
    path: ../Packages/LegadoCore
targets:
  Legado:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources/zh-Hans.lproj
        buildPhase: resources
      - path: Resources/AlternateIcons
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.legado.ios
    dependencies:
      - package: LegadoCore
        product: LegadoCore
      - package: GRDB
        product: GRDB
    info:
      path: Info.plist
      properties:
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, en]
        CFBundleDisplayName: 阅读
        NSLocalNetworkUsageDescription: 开启 Web 服务后，允许同一局域网的设备访问书架和导入书籍。
        NSCameraUsageDescription: 扫描书源二维码以导入书源
        CFBundleURLTypes:
          - CFBundleURLName: Legado Import
            CFBundleURLSchemes: [legado, yuedu]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Local Books
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
              - com.adobe.pdf
              - org.idpf.epub-container
              - public.zip-archive
              - com.legado.local-book
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.legado.local-book
            UTTypeDescription: Local Book or Archive
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [umd, mobi, azw3, azw, rar, 7z]
        CFBundleIcons:
          CFBundleAlternateIcons:
            launcher1:
              CFBundleIconFiles: [launcher1]
            launcher2:
              CFBundleIconFiles: [launcher2]
            launcher3:
              CFBundleIconFiles: [launcher3]
            launcher4:
              CFBundleIconFiles: [launcher4]
            launcher5:
              CFBundleIconFiles: [launcher5]
            launcher6:
              CFBundleIconFiles: [launcher6]
        CFBundleIcons~ipad:
          CFBundleAlternateIcons:
            launcher1:
              CFBundleIconFiles: [launcher1]
            launcher2:
              CFBundleIconFiles: [launcher2]
            launcher3:
              CFBundleIconFiles: [launcher3]
            launcher4:
              CFBundleIconFiles: [launcher4]
            launcher5:
              CFBundleIconFiles: [launcher5]
            launcher6:
              CFBundleIconFiles: [launcher6]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes: [audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [io.legado.ios.refresh]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  LegadoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/LegadoTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.legado.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Legado.app/Legado
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: Legado
      - package: LegadoCore
        product: LegadoCore
  LegadoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/LegadoUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.legado.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Legado
    dependencies:
      - target: Legado
schemes:
  Legado:
    build:
      targets:
        Legado: all
        LegadoTests: [test]
        LegadoUITests: [test]
    test:
      targets:
        - LegadoTests
        - LegadoUITests
