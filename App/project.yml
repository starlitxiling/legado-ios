name: Legado
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Manual
    TARGETED_DEVICE_FAMILY: '1,2'
packages:
  LegadoCore:
    path: ../Packages/LegadoCore
targets:
  Legado:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources/AlternateIcons
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.legado.ios
    dependencies:
      - package: LegadoCore
        product: LegadoCore
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 阅读
        CFBundleIcons:
          CFBundleAlternateIcons:
            launcher1:
              CFBundleIconFiles: [launcher1]
            launcher2:
              CFBundleIconFiles: [launcher2]
            launcher3:
              CFBundleIconFiles: [launcher3]
            launcher4:
              CFBundleIconFiles: [launcher4]
            launcher5:
              CFBundleIconFiles: [launcher5]
            launcher6:
              CFBundleIconFiles: [launcher6]
        CFBundleIcons~ipad:
          CFBundleAlternateIcons:
            launcher1:
              CFBundleIconFiles: [launcher1]
            launcher2:
              CFBundleIconFiles: [launcher2]
            launcher3:
              CFBundleIconFiles: [launcher3]
            launcher4:
              CFBundleIconFiles: [launcher4]
            launcher5:
              CFBundleIconFiles: [launcher5]
            launcher6:
              CFBundleIconFiles: [launcher6]
        UIBackgroundModes: [audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [io.legado.ios.refresh]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  LegadoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/LegadoTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.legado.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Legado.app/Legado
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: Legado
      - package: LegadoCore
        product: LegadoCore
schemes:
  Legado:
    build:
      targets:
        Legado: all
        LegadoTests: [test]
    test:
      targets:
        - LegadoTests
