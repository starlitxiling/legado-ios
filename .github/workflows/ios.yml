name: iOS 构建与离线测试

on:
  push:
    branches: [ios]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/.build/clang-cache
    defaults:
      run:
        shell: bash
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择 Xcode 16.4
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 缓存 SwiftPM 依赖
        uses: actions/cache@v4
        with:
          path: |
            .build/swiftpm-cache
            Packages/LegadoCore/.build/repositories
            Packages/LegadoCore/.build/checkouts
            tools/appcore-check/.build/repositories
            tools/appcore-check/.build/checkouts
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-16.4-swiftpm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-16.4-swiftpm-

      # 首次解析依赖需要网络；测试用合成数据和假客户端，不访问真实书源。
      - name: LegadoCore 离线测试
        run: >-
          swift test --package-path Packages/LegadoCore
          --cache-path "$GITHUB_WORKSPACE/.build/swiftpm-cache"
          --force-resolved-versions --skip-update

      - name: AppCore 离线测试
        run: >-
          swift test --package-path tools/appcore-check
          --cache-path "$GITHUB_WORKSPACE/.build/swiftpm-cache"
          --force-resolved-versions --skip-update

      - name: 构建未签名 IPA
        run: tools/build-ipa.sh

      - name: 上传未签名 IPA
        uses: actions/upload-artifact@v4
        with:
          name: Legado-unsigned-${{ github.sha }}
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 14
